<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StickerAI – Gerador de Stickers</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ── TOKENS ── */
  :root {
    --ink:     #0d0d0d;
    --paper:   #f7f5f0;
    --bright:  #ff3cac;
    --pop:     #ffe600;
    --cool:    #3cffd0;
    --mid:     #6b6b6b;
    --card:    #ffffff;
    --radius:  18px;
    --shadow:  0 4px 32px rgba(0,0,0,.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot {
    width: 12px; height: 12px;
    background: var(--bright);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: .7; }
  }
  .badge {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    background: var(--pop);
    color: var(--ink);
    padding: 4px 10px;
    border-radius: 99px;
  }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 56px 24px 32px;
    max-width: 680px;
    margin: 0 auto;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  .hero h1 span {
    position: relative;
    display: inline-block;
  }
  .hero h1 span::after {
    content: '';
    position: absolute;
    left: 0; bottom: 2px;
    width: 100%; height: 8px;
    background: var(--pop);
    z-index: -1;
    border-radius: 4px;
  }
  .hero p {
    margin-top: 14px;
    color: var(--mid);
    font-size: 1.05rem;
    line-height: 1.6;
  }

  /* ── INPUT AREA ── */
  .input-section {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px 24px;
  }
  .input-wrap {
    display: flex;
    gap: 10px;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 8px 8px 24px;
    box-shadow: var(--shadow), 0 0 0 2px var(--ink);
  }
  .input-wrap input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    background: transparent;
    color: var(--ink);
  }
  .input-wrap input::placeholder { color: #aaa; }
  .btn-gen {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-family: 'Syne', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, transform .1s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-gen:hover  { background: var(--bright); }
  .btn-gen:active { transform: scale(.97); }
  .btn-gen:disabled { opacity: .5; cursor: not-allowed; }

  /* ── SUGGESTION CHIPS ── */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .chip {
    background: var(--card);
    border: 1.5px solid #e0e0e0;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .chip:hover {
    border-color: var(--bright);
    background: #fff0f8;
    transform: translateY(-1px);
  }
  .chip:active { transform: scale(.96); }

  /* ── LOADING ── */
  #loading {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 48px 24px;
    text-align: center;
  }
  .loader-ring {
    width: 56px; height: 56px;
    border: 4px solid #eee;
    border-top-color: var(--bright);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-dots span {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--bright);
    border-radius: 50%;
    margin: 0 3px;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .loader-dots span:nth-child(2) { animation-delay: .2s; }
  .loader-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
  #loading p {
    color: var(--mid);
    font-size: .9rem;
  }

  /* ── RESULTS ── */
  #results {
    display: none;
    max-width: 980px;
    margin: 0 auto;
    padding: 24px 24px 64px;
  }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .results-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
  }
  .btn-regen {
    background: transparent;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 8px 18px;
    font-family: 'Inter', sans-serif;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-regen:hover { background: var(--ink); color: #fff; }

  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }
  .sticker-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    cursor: default;
  }
  .sticker-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,.13);
  }
  .sticker-preview {
    background: repeating-conic-gradient(#e8e8e8 0% 25%, white 0% 50%) 0 0/20px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    min-height: 240px;
  }
  .sticker-preview svg {
    max-width: 100%;
    max-height: 180px;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.18));
  }
  .sticker-footer {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f0f0f0;
  }
  .sticker-label {
    font-size: .82rem;
    font-weight: 600;
    color: var(--mid);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .btn-dl {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    font-family: 'Inter', sans-serif;
  }
  .btn-dl:hover { background: var(--bright); }

  /* ── ERROR ── */
  #error-msg {
    display: none;
    background: #fff0f0;
    border: 1.5px solid #ffb3b3;
    border-radius: var(--radius);
    padding: 20px 24px;
    color: #c00;
    font-size: .9rem;
    max-width: 680px;
    margin: 16px auto;
    text-align: center;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    color: #bbb;
    font-size: .78rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    StickerAI
  </div>
  <span class="badge">✦ Powered by Claude</span>
</header>

<section class="hero">
  <h1>Crie stickers únicos<br>com <span>inteligência artificial</span></h1>
  <p>Descreva sua ideia e a IA gera 3 designs prontos para imprimir ou usar digitalmente.</p>
</section>

<section class="input-section">
  <div class="input-wrap">
    <input id="idea-input" type="text" placeholder="Ex: café, frases motivacionais, gatinho fofo…" maxlength="120" />
    <button class="btn-gen" id="gen-btn" onclick="generateStickers()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Gerar Stickers
    </button>
  </div>

  <div class="chips" id="chips-area">
    <!-- populated by JS -->
  </div>
</section>

<div id="loading">
  <div class="loader-ring"></div>
  <div class="loader-dots"><span></span><span></span><span></span></div>
  <p id="loading-msg">Desenhando seus stickers…</p>
</div>

<div id="error-msg"></div>

<section id="results">
  <div class="results-header">
    <h2 id="results-title">3 stickers gerados ✦</h2>
    <button class="btn-regen" onclick="generateStickers()">↻ Gerar novamente</button>
  </div>
  <div class="sticker-grid" id="sticker-grid"></div>
</section>

<footer>StickerAI · Geração via Claude Sonnet · SVG com fundo transparente</footer>

<script>
// ── SUGGESTIONS ──────────────────────────────────────────────────────────────
const SUGGESTIONS = [
  "☕ Café", "🌵 Cactus fofo", "🐱 Gato meme",
  "🔥 Frases motivacionais", "🌈 Arco-íris", "🍕 Pizza",
  "🦋 Borboleta kawaii", "🚀 Astronauta", "🌙 Lua e estrelas",
  "💀 Caveira mexicana", "🐸 Sapo na chuva", "⚡ Energia boa"
];

function initChips() {
  const area = document.getElementById('chips-area');
  SUGGESTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = s;
    btn.onclick = () => {
      document.getElementById('idea-input').value = s.replace(/^[\p{Emoji}\s]+/u, '').trim();
      generateStickers();
    };
    area.appendChild(btn);
  });
}

// ── LOADING MESSAGES ──────────────────────────────────────────────────────────
const LOADING_MSGS = [
  "Consultando o artista AI…",
  "Escolhendo paleta de cores…",
  "Adicionando detalhes criativos…",
  "Finalizando os stickers…"
];
let msgInterval;
function startLoadingMsg() {
  let i = 0;
  document.getElementById('loading-msg').textContent = LOADING_MSGS[0];
  msgInterval = setInterval(() => {
    i = (i + 1) % LOADING_MSGS.length;
    document.getElementById('loading-msg').textContent = LOADING_MSGS[i];
  }, 1800);
}
function stopLoadingMsg() { clearInterval(msgInterval); }

// ── MAIN GENERATE ─────────────────────────────────────────────────────────────
async function generateStickers() {
  const idea = document.getElementById('idea-input').value.trim();
  if (!idea) {
    document.getElementById('idea-input').focus();
    return;
  }

  // UI state
  document.getElementById('results').style.display  = 'none';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('loading').style.display   = 'flex';
  document.getElementById('gen-btn').disabled = true;
  startLoadingMsg();

  const prompt = buildPrompt(idea);

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!response.ok) throw new Error(`API error ${response.status}`);
    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');
    const svgs = parseSVGs(text);

    if (svgs.length === 0) throw new Error("Nenhum SVG foi gerado. Tente uma ideia diferente.");

    renderResults(idea, svgs);
  } catch (err) {
    showError(err.message);
  } finally {
    stopLoadingMsg();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('gen-btn').disabled = false;
  }
}

// ── PROMPT ───────────────────────────────────────────────────────────────────
function buildPrompt(idea) {
  return `Você é um designer gráfico especialista em stickers. Crie EXATAMENTE 3 designs de stickers SVG criativos e distintos sobre o tema: "${idea}".

REGRAS OBRIGATÓRIAS:
1. Retorne APENAS os 3 SVGs, sem texto explicativo antes ou depois
2. Cada SVG deve começar com <SVG_1>, <SVG_2>, <SVG_3> como marcador de separação
3. Cada SVG deve ter viewBox="0 0 300 300" e width="300" height="300"
4. Fundo TRANSPARENTE (sem <rect> de fundo branco/colorido que ocupe tudo)
5. Cada sticker deve ter um estilo visual diferente:
   - Sticker 1: estilo cartoon/colorido com bordas grossas e expressivo
   - Sticker 2: estilo minimalista/moderno, clean e elegante
   - Sticker 3: estilo retro/bold com tipografia forte ou padrão vintage
6. Use cores vibrantes, formas bem definidas e boa legibilidade
7. Inclua elementos decorativos relevantes ao tema (ícones, formas, texto curto se adequado)
8. Os SVGs devem ser autocontidos e bem formados

Formato de resposta:
<SVG_1>
<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300">
... conteúdo do sticker 1 ...
</svg>
</SVG_1>

<SVG_2>
<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300">
... conteúdo do sticker 2 ...
</svg>
</SVG_2>

<SVG_3>
<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300">
... conteúdo do sticker 3 ...
</svg>
</SVG_3>

Agora crie os 3 stickers para o tema: "${idea}"`;
}

// ── PARSE SVGs ────────────────────────────────────────────────────────────────
function parseSVGs(text) {
  const svgs = [];
  const tagPattern = /<SVG_\d+>([\s\S]*?)<\/SVG_\d+>/g;
  let match;
  while ((match = tagPattern.exec(text)) !== null) {
    const content = match[1].trim();
    const svgMatch = content.match(/<svg[\s\S]*?<\/svg>/i);
    if (svgMatch) svgs.push(svgMatch[0]);
  }
  // Fallback: grab raw <svg> blocks if markers not found
  if (svgs.length === 0) {
    const rawPattern = /<svg[\s\S]*?<\/svg>/gi;
    let m;
    while ((m = rawPattern.exec(text)) !== null) svgs.push(m[0]);
  }
  return svgs.slice(0, 3);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const LABELS = ["Cartoon", "Minimalista", "Retro"];

function renderResults(idea, svgs) {
  const grid = document.getElementById('sticker-grid');
  grid.innerHTML = '';

  svgs.forEach((svg, i) => {
    const card = document.createElement('div');
    card.className = 'sticker-card';

    const preview = document.createElement('div');
    preview.className = 'sticker-preview';
    preview.innerHTML = svg;

    const footer = document.createElement('div');
    footer.className = 'sticker-footer';
    footer.innerHTML = `
      <span class="sticker-label">${LABELS[i] || `Variação ${i+1}`}</span>
      <button class="btn-dl" onclick="downloadSVG(this, ${i})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Baixar SVG
      </button>`;

    card.appendChild(preview);
    card.appendChild(footer);
    grid.appendChild(card);
  });

  // Store SVGs for download
  window._generatedSVGs = svgs;
  document.getElementById('results-title').textContent = `3 stickers para "${idea}" ✦`;
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── DOWNLOAD ──────────────────────────────────────────────────────────────────
function downloadSVG(btn, idx) {
  const svg = window._generatedSVGs?.[idx];
  if (!svg) return;
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `sticker-${LABELS[idx].toLowerCase()}.svg`;
  a.click();
  URL.revokeObjectURL(url);

  // micro feedback
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Baixado!';
  btn.style.background = '#22c55e';
  setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 2000);
}

// ── ERROR ─────────────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = `⚠ ${msg}`;
  el.style.display = 'block';
}

// ── ENTER KEY ─────────────────────────────────────────────────────────────────
document.getElementById('idea-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') generateStickers();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
initChips();
</script>
</body>
</html>
